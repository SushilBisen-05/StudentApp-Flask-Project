<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOI | User Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* Purple Gradient Background */
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        /* Black Navbar at the very top */
        .custom-nav {
            background: #212529; /* Solid Black/Dark Grey */
            padding: 10px 20px;
            display: flex;
            align-items: center;
            color: white;
            width: 100%;
            position: absolute; /* Screen ke top par fix karne ke liye */
            top: 0;
            left: 0;
            height: 50px;
        }

        .bank-name {
            font-size: 1.2rem;
            font-weight: 500;
            margin: 0;
            display: flex;
            align-items: center;
        }

        /* Profile Card Centering */
        .profile-wrapper {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 60px; /* Navbar ke niche jagah banane ke liye */
        }

        .card {
            border-radius: 0px; /* Sharp corners jaisa image mein hai */
            overflow: hidden;
            border: none;
            background: rgba(255, 255, 255, 0.98);
            width: 100%;
            max-width: 550px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .card-header {
            background-color: #764ba2 !important; /* Blue header jaisa image mein hai */
            color: white;
            text-align: center;
            padding: 15px;
        }
        
        .table {
            margin-bottom: 0;
        }

        .table th {
            width: 40%;
            color: #000;
            font-weight: bold;
            padding: 15px;
        }

        .table td {
            padding: 15px;
            color: #333;
        }

        .btn-back {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 8px 20px;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div class="custom-nav">
        <div class="bank-name">
            <span style="margin-right: 10px;">🏦</span> Bank of India
        </div>
    </div>

    <div class="profile-wrapper">
        <div class="card">
            <div class="card-header">
                <h3 class="mb-0">User Profile</h3>
            </div>
            <div class="card-body p-0">
                <table class="table">
                    <tr>
                        <th>Full Name:</th>
                        <td>{{ user[0] }}</td>
                    </tr>
                    <tr>
                        <th>Account No:</th>
                        <td>{{ user[1] }}</td>
                    </tr>
                    <tr>
                        <th>Mobile:</th>
                        <td>{{ user[2] or 'Not Provided' }}</td>
                    </tr>
                    <tr>
                        <th>Email:</th>
                        <td>{{ user[3] }}</td>
                    </tr>
                    <tr>
                        <th>Address:</th>
                        <td>{{ user[4] or 'Not Provided' }}</td>
                    </tr>
                    <tr>
                        <th>Bank:</th>
                        <td>Bank of India</td>
                    </tr>
                </table>
            </div>
            <div class="card-footer text-center bg-light border-0 py-3">
                <a href="/dashboard" class="btn-back">Back to Dashboard</a>
            </div>
        </div>
    </div>
</body>
</html>
