<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOI | Open Digital Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .reg-card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: none; }
        .reg-header { background: #1a237e; color: white; padding: 30px; text-align: center; }
        .form-label { font-weight: 600; color: #444; font-size: 0.9rem; }
        .btn-reg { background: #fb8c00; color: white; font-weight: 700; border-radius: 8px; padding: 12px; border: none; width: 100%; transition: 0.3s; }
        .btn-reg:hover { background: #e67e00; transform: scale(1.02); }
        .form-control { border-radius: 8px; padding: 10px; border: 1px solid #ced4da; }
        .info-section { background: #e3f2fd; padding: 20px; border-radius: 10px; font-size: 0.85rem; color: #0d47a1; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">
            <div class="card reg-card">
                <div class="reg-header">
                    <h3>🏦 Bank of India</h3>
                    <p class="mb-0">Join 10 Million+ Happy Customers</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form action="/register" method="POST">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text" name="name" class="form-control" placeholder="As per PAN/Aadhar" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email ID</label>
                                <input type="email" name="email" class="form-control" placeholder="name@email.com" autocomplete="none" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Mobile Number</label>
                                <input type="text" name="mobile" class="form-control" placeholder="+91 XXXXX XXXXX" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Set Password</label>
                                <input type="password" name="password" class="form-control" placeholder="Enter Your Password" autocomplete="new-password" required>
                            </div>
                            <div class="col-12 mb-3">
                                <label class="form-label">Residential Address</label>
                                <textarea name="address" class="form-control" rows="2" placeholder="Full permanent address..." required></textarea>
                            </div>
                        </div>

                        <div class="info-section mb-4">
                            <strong>Note:</strong> By clicking Register, you agree to our terms for digital account opening. Ensure your mobile number is active for OTP verification.
                        </div>

                        <button type="submit" class="btn-reg shadow-sm">Open My Account Now</button>
                    </form>
                    <div class="text-center mt-4">
                        Already have an account? <a href="/" class="text-primary fw-bold text-decoration-none">Login Here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
